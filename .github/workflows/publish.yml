name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag version, without v
        required: true
        type: string
      mode:
        description: Publish the release tag (stage only when explicitly requested)
        required: true
        default: publish
        type: choice
        options:
          - publish
          - stage

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    env:
      RELEASE_MODE: ${{ inputs.mode || 'publish' }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v$REQUESTED_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected an existing semver release tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Classify tag and prepare env
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          echo "Detected tag: v$TAG"

          VERSION="$TAG"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting/package.json','utf8')).version)")
          BOARD_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting-board/package.json','utf8')).version)")

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($VERSION) must match package version ($PKG_VERSION)."
            exit 1
          fi

          if [ "$VERSION" != "$BOARD_VERSION" ]; then
            echo "::error::Tag version ($VERSION) must match @hamster-note/painting-board version ($BOARD_VERSION)."
            exit 1
          fi

          if [ "$PKG_VERSION" != "$BOARD_VERSION" ]; then
            echo "::error::Lockstep release: packages/painting ($PKG_VERSION) and packages/painting-board ($BOARD_VERSION) versions must be identical."
            exit 1
          fi

          if [[ "$PKG_VERSION" =~ -dev ]]; then
            PUBLISH_TAG=dev
            echo "PUBLISH_TAG=dev" >> "$GITHUB_ENV"
            echo "Version type: Dev Pre-release"
          elif [[ "$PKG_VERSION" =~ -beta ]]; then
            PUBLISH_TAG=beta
            echo "PUBLISH_TAG=beta" >> "$GITHUB_ENV"
            echo "Version type: Beta Pre-release"
          else
            PUBLISH_TAG=latest
            echo "PUBLISH_TAG=latest" >> "$GITHUB_ENV"
            echo "Version type: Release"
          fi

          echo "Tag version: $VERSION"
          echo "Package version: $PKG_VERSION"
          echo "Publish tag: $PUBLISH_TAG"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Check if version already published
        id: version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const states = [];
          for (const [directory, output] of [['painting', 'painting_exists'], ['painting-board', 'board_exists']]) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            let exists;
            try {
              const version = JSON.parse(execFileSync('npm', [
                'view', `${pkg.name}@${process.env.VERSION}`, 'version',
                '--registry=https://registry.npmjs.org', '--json', '--prefer-online',
              ], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }));
              assert.equal(version, process.env.VERSION, `${pkg.name} public version`);
              exists = true;
            } catch (error) {
              if (!error.stdout || JSON.parse(error.stdout).error?.code !== 'E404') {
                throw error;
              }
              exists = false;
            }
            console.log(`${pkg.name}@${process.env.VERSION}: exists=${exists}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `${output}=${exists}\n`);
            states.push(exists);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `should_publish=${states.some((exists) => !exists)}\n`);
          NODE

      - name: Build project
        if: steps.version.outputs.should_publish == 'true'
        run: |
          pnpm build
          pnpm verify:layered

      - name: Stage painting for maintainer approval
        if: steps.version.outputs.painting_exists == 'false' && env.RELEASE_MODE == 'stage'
        working-directory: packages/painting
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --tag "$PUBLISH_TAG" --access public

      - name: Stage painting-board for maintainer approval
        if: steps.version.outputs.board_exists == 'false' && env.RELEASE_MODE == 'stage'
        working-directory: packages/painting-board
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --tag "$PUBLISH_TAG" --access public

      - name: Report pending approval
        if: steps.version.outputs.should_publish == 'true' && env.RELEASE_MODE == 'stage'
        run: |
          echo "## npm approval required" >> "$GITHUB_STEP_SUMMARY"
          echo "Missing packages at $VERSION were staged. See the staging steps for their stage IDs." >> "$GITHUB_STEP_SUMMARY"
          echo 'A maintainer must approve painting, then painting-board, using `npm stage approve <stage-id>`.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Staging is not a public npm release. After approval, rerun this workflow in publish mode to verify and create the GitHub Release.' >> "$GITHUB_STEP_SUMMARY"

      # Direct publishing uses the package's trusted publisher, not the stage-only NPM_TOKEN.
      - name: Publish painting with npm trusted publishing
        if: steps.version.outputs.painting_exists == 'false' && env.RELEASE_MODE == 'publish'
        working-directory: packages/painting
        run: npm publish --provenance --tag "$PUBLISH_TAG" --access public

      - name: Publish painting-board with npm trusted publishing
        if: steps.version.outputs.board_exists == 'false' && env.RELEASE_MODE == 'publish'
        working-directory: packages/painting-board
        run: npm publish --provenance --tag "$PUBLISH_TAG" --access public

      - name: Verify public release before creating GitHub Release
        if: env.RELEASE_MODE == 'publish'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const readPackage = (name) => JSON.parse(readFileSync(`packages/${name}/package.json`, 'utf8'));
          const painting = readPackage('painting');
          const board = readPackage('painting-board');
          for (const pkg of [painting, board]) {
            const published = JSON.parse(execFileSync('npm', [
              'view', `${pkg.name}@${process.env.VERSION}`, 'version', 'dependencies', 'dist-tags',
              '--registry=https://registry.npmjs.org', '--json', '--prefer-online',
            ], { encoding: 'utf8' }));
            assert.equal(published.version, process.env.VERSION, `${pkg.name} public version`);
            assert.equal(published['dist-tags'][process.env.PUBLISH_TAG], process.env.VERSION, `${pkg.name} dist-tag`);
            if (pkg.name === board.name) {
              assert.equal(published.dependencies[painting.name], process.env.VERSION, 'painting-board dependency');
            }
            console.log(JSON.stringify({ name: pkg.name, ...published }));
          }
          NODE

      - name: Create GitHub Release
        if: env.RELEASE_MODE == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true

      - name: Explain trusted publishing requirements on failure
        if: failure() && env.RELEASE_MODE == 'publish'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Release was not completed
          Inspect the failed step above. Direct publishing uses GitHub OIDC, not NPM_TOKEN.
          For OIDC authentication or permission errors, check BOTH npm package settings:
          - Trusted publisher: GitHub Actions, owner HamsterNote, repository painting, workflow publish.yml.
          - The trusted publisher must allow npm publish (stage-only permissions cannot publish directly).
          npm permissions must be configured by a package maintainer; the workflow cannot grant itself access.
          After resolving the error, rerun this workflow in publish mode for the existing version. Do not move its tag.
          No GitHub Release is created until both public versions, dist-tags, and the board dependency are verified.
          SUMMARY
