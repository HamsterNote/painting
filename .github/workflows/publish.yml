name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag version, without v
        required: true
        type: string
      mode:
        description: Stage for maintainer approval or publish directly
        required: true
        default: stage
        type: choice
        options:
          - stage
          - publish

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    env:
      RELEASE_MODE: ${{ inputs.mode || 'publish' }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v$REQUESTED_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected an existing semver release tag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Classify tag and prepare env
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          echo "Detected tag: v$TAG"

          VERSION="$TAG"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting/package.json','utf8')).version)")
          BOARD_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting-board/package.json','utf8')).version)")

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($VERSION) must match package version ($PKG_VERSION)."
            exit 1
          fi

          if [ "$VERSION" != "$BOARD_VERSION" ]; then
            echo "::error::Tag version ($VERSION) must match @hamster-note/painting-board version ($BOARD_VERSION)."
            exit 1
          fi

          if [ "$PKG_VERSION" != "$BOARD_VERSION" ]; then
            echo "::error::Lockstep release: packages/painting ($PKG_VERSION) and packages/painting-board ($BOARD_VERSION) versions must be identical."
            exit 1
          fi

          if [[ "$PKG_VERSION" =~ -dev ]]; then
            PUBLISH_TAG=dev
            echo "PUBLISH_TAG=dev" >> "$GITHUB_ENV"
            echo "Version type: Dev Pre-release"
          elif [[ "$PKG_VERSION" =~ -beta ]]; then
            PUBLISH_TAG=beta
            echo "PUBLISH_TAG=beta" >> "$GITHUB_ENV"
            echo "Version type: Beta Pre-release"
          else
            PUBLISH_TAG=latest
            echo "PUBLISH_TAG=latest" >> "$GITHUB_ENV"
            echo "Version type: Release"
          fi

          echo "Tag version: $VERSION"
          echo "Package version: $PKG_VERSION"
          echo "Publish tag: $PUBLISH_TAG"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install npm with staged publishing support
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Check if version already published
        id: version
        shell: bash
        run: |
          PKG_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting/package.json','utf8')).name)")
          BOARD_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting-board/package.json','utf8')).name)")
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting/package.json','utf8')).version)")
          echo "Packages: $PKG_NAME, $BOARD_NAME"
          echo "Version: $VERSION"

          PKG_EXISTS=false
          BOARD_EXISTS=false
          if npm view "$PKG_NAME@$VERSION" version > /dev/null 2>&1; then
            PKG_EXISTS=true
          fi
          if npm view "$BOARD_NAME@$VERSION" version > /dev/null 2>&1; then
            BOARD_EXISTS=true
          fi

          if [ "$PKG_EXISTS" = "true" ] && [ "$BOARD_EXISTS" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION of both packages already exists on npm, skip publishing."
          elif [ "$PKG_EXISTS" = "false" ] && [ "$BOARD_EXISTS" = "false" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not found on npm for either package, will publish both."
          else
            echo "::error::Partial publish state: $PKG_NAME@$VERSION exists=$PKG_EXISTS, $BOARD_NAME@$VERSION exists=$BOARD_EXISTS. Resolve manually before re-tagging."
            exit 1
          fi

      - name: Build project
        if: steps.version.outputs.should_publish == 'true'
        run: |
          pnpm build
          pnpm verify:layered

      - name: Stage painting for maintainer approval
        if: steps.version.outputs.should_publish == 'true' && env.RELEASE_MODE == 'stage'
        working-directory: packages/painting
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --tag "$PUBLISH_TAG" --access public

      - name: Stage painting-board for maintainer approval
        if: steps.version.outputs.should_publish == 'true' && env.RELEASE_MODE == 'stage'
        working-directory: packages/painting-board
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --tag "$PUBLISH_TAG" --access public

      - name: Report pending approval
        if: steps.version.outputs.should_publish == 'true' && env.RELEASE_MODE == 'stage'
        run: |
          echo "## npm approval required" >> "$GITHUB_STEP_SUMMARY"
          echo "Both packages at $VERSION were staged. See the staging steps for their stage IDs." >> "$GITHUB_STEP_SUMMARY"
          echo 'A maintainer must approve painting, then painting-board, using `npm stage approve <stage-id>`.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Staging is not a public npm release. After approval, rerun this workflow in publish mode to verify and create the GitHub Release.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true' && env.RELEASE_MODE == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 依赖序：painting-board 依赖 painting，必须先发布 painting
          cd packages/painting
          npm publish --provenance --tag "$PUBLISH_TAG" --access public
          cd ../painting-board
          npm publish --provenance --tag "$PUBLISH_TAG" --access public

      - name: Ensure pre-release dist-tag
        if: (env.PUBLISH_TAG == 'dev' || env.PUBLISH_TAG == 'beta') && steps.version.outputs.should_publish == 'true' && env.RELEASE_MODE == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting/package.json','utf8')).name)")
          BOARD_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting-board/package.json','utf8')).name)")
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/painting/package.json','utf8')).version)")
          echo "Ensure dist-tag: ${PUBLISH_TAG} -> $VERSION"
          npm dist-tag add "$PKG_NAME@$VERSION" "$PUBLISH_TAG" || true
          npm dist-tag add "$BOARD_NAME@$VERSION" "$PUBLISH_TAG" || true
          npm dist-tag ls "$PKG_NAME"
          npm dist-tag ls "$BOARD_NAME"

      - name: Create GitHub Release
        if: env.RELEASE_MODE == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
