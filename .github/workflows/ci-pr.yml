name: PR CI (tests & build)

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: Test and Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Run lint
        run: |
          pnpm lint

      - name: Run typecheck
        run: |
          pnpm typecheck

      - name: Run unit tests
        run: |
          pnpm test
          node --test scripts/perf/*.test.mjs

      - name: Validate active OpenSpec change
        run: pnpm dlx @fission-ai/openspec@1.13.1 validate layered-perfect-freehand-surface --strict

      - name: Install Playwright Chromium and WebKit
        id: install-playwright
        run: |
          pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright UI tests
        id: run-playwright-ui-tests
        run: |
          pnpm test:ui

      - name: Run independent WebKit regressions
        id: run-playwright-webkit
        run: pnpm test:webkit

      - name: Upload Playwright report
        if: ${{ always() && (steps.install-playwright.conclusion == 'failure' || steps.run-playwright-ui-tests.conclusion == 'failure' || steps.run-playwright-webkit.conclusion == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: ${{ always() && (steps.install-playwright.conclusion == 'failure' || steps.run-playwright-ui-tests.conclusion == 'failure' || steps.run-playwright-webkit.conclusion == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Build library and demo
        run: |
          pnpm build:all

      - name: Verify npm pack (dry-run)
        run: |
          pnpm pack:dry

      - name: Verify layered exports and retired runtime absence
        run: pnpm verify:layered

      # Static exports resolve the Expo DOM host; real device acceptance is separate.
      - name: Export Android Expo DOM application
        run: pnpm --filter @hamster-note/painting-playground build:android

      - name: Export iOS Expo DOM application
        run: pnpm --filter @hamster-note/painting-playground exec expo export --platform ios
