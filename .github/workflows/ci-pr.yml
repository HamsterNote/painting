name: PR CI (tests & build)

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Run lint
        run: |
          pnpm lint

      - name: Run typecheck
        run: |
          pnpm typecheck

      - name: Run unit tests
        run: |
          pnpm test

      - name: Install Playwright Chromium
        id: install-playwright
        run: |
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright UI tests
        id: run-playwright-ui-tests
        run: |
          pnpm test:ui

      - name: Upload Playwright report
        if: ${{ always() && (steps.install-playwright.conclusion == 'failure' || steps.run-playwright-ui-tests.conclusion == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: ${{ always() && (steps.install-playwright.conclusion == 'failure' || steps.run-playwright-ui-tests.conclusion == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Build library and demo
        run: |
          pnpm build:all

      - name: Verify npm pack (dry-run)
        run: |
          pnpm pack:dry
